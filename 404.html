<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        // Theme initialization
        (function () {
            // Stored value is only ever 'light' or 'dark' — an explicit override.
            // No stored value means no override: leave data-theme unset so the
            // CSS media queries resolve it from the OS preference instead.
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        })();
    </script>
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found | Ryan March</title>
    <meta name="description" content="The page you are looking for does not exist.">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* 404 Specific styles */
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            width: 100%;
            padding: 2rem;
            text-align: center;
        }

        .error-card {
            max-width: 500px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .error-code {
            font-size: clamp(5rem, 12vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-color), var(--tag-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            animation: pulseCode 4s ease-in-out infinite;
        }

        .error-title {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .error-description {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.5;
            text-wrap: balance;
            margin-bottom: 0.5rem;
        }

        .error-actions {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .error-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: 1px solid transparent;
            transform: translateZ(0);
            transition: 
                background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 1025px) {
            .error-btn:hover {
                background-color: var(--btn-hover-bg);
                color: var(--btn-hover-text);
                border-color: var(--btn-hover-border);
                box-shadow: var(--shadow-md);
                transform: translateY(-2px) translateZ(0);
            }
        }

        @keyframes pulseCode {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>

<body>
    <div class="background-container" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header class="slim-header visible" id="slim-header" style="position: absolute; top: 0; left: 0; right: 0;">
        <div class="slim-header-container">
            <a href="/" class="slim-header-brand">
                <div class="slim-avatar" aria-hidden="true">RM</div>
                <span class="slim-name">Ryan March</span>
            </a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span id="theme-status" class="theme-status" aria-live="polite"></span>
            </button>
        </div>
    </header>

    <main class="error-container">
        <div class="glimmer-card error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-description">
                The page you are looking for doesn't exist, has been moved, or was typed incorrectly.
            </p>
            <div class="error-actions">
                <a href="/" class="error-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </main>

    <script src="/assets/js/theme.js" defer></script>
    <script>
        // Glimmering border effect - only on desktop
        if (window.matchMedia("(min-width: 951px)").matches) {
            let mouseX = 0;
            let mouseY = 0;
            const card = document.querySelector('.glimmer-card');

            const updateGlimmer = () => {
                const rect = card.getBoundingClientRect();
                requestAnimationFrame(() => {
                    card.style.setProperty('--mouse-x', `${mouseX - rect.left}px`);
                    card.style.setProperty('--mouse-y', `${mouseY - rect.top}px`);
                });
            };

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                updateGlimmer();
            });

            document.addEventListener('scroll', updateGlimmer, { capture: true, passive: true });
        }
    </script>
</body>

</html>
